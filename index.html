<!DOCTYPE html>
<!--
  Family board. Based on FamilyDashboard by stewie1308-ui (MIT License, Copyright (c) 2026 stewie1308-ui),
  https://github.com/stewie1308-ui/FamilyDashboard . Changes: night mode 19:00-07:00, TfL trains and buses panel.
  This file holds no personal data or keys: the board link is entered on the device and kept there.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #1C1A2E; overflow: hidden; }
  body { font-family: 'EB Garamond', Georgia, serif; color: #F3E9D2; -webkit-font-smoothing: antialiased; }
  .cz { font-family: Cinzel, Georgia, serif; }
  #stage { width: 1280px; height: 720px; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  #day { box-sizing: border-box; width: 1280px; height: 720px; padding: 28px 32px; display: flex; gap: 28px; }
  .col-l { width: 500px; flex: none; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .col-r { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .label { font-family: Cinzel, serif; letter-spacing: .28em; color: #C9B37E; font-size: 15px; }
  .muted { color: #A9A2C6; }
  .box { border: 1px solid #4A4466; border-radius: 12px; }
  .row { display: flex; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .badge { display: flex; width: 40px; height: 40px; flex: none; border-radius: 999px; align-items: center; justify-content: center; }
  .parch { background-color: #F1E6CC; background-size: cover; background-position: center; color: #2A2118; }
  .ev { display: flex; gap: 16px; align-items: center; padding: 9px 18px; border-radius: 12px; }
  .ev .t { font-size: 22px; font-weight: 500; line-height: 1.15; }
  .ev .w { font-size: 15px; color: #5C4A33; }
  .ev .time { font-family: Cinzel, serif; font-size: 20px; }
  .chip { display: inline-flex; gap: 8px; align-items: center; padding: 5px 12px 5px 8px; border-radius: 999px; font-size: 17px; margin: 3px 8px 3px 0; }
  .chip .ct { color: #5C4A33; }
  .chip .cn { font-weight: 500; }
  .wk { display: flex; gap: 16px; align-items: center; padding: 6px 0; border-top: 1px solid #D8C9A6; min-height: 40px; }
  .wk .d { width: 76px; flex: none; display: flex; align-items: baseline; gap: 8px; }
  .wk .dow { font-family: Cinzel, serif; font-size: 13px; letter-spacing: .18em; color: #5C4A33; }
  .wk .dn { margin-left: auto; flex: none; display: flex; align-items: center; gap: 6px; font-style: italic; font-size: 17px; color: #6B5636; padding-left: 12px; max-width: 230px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk .num { font-family: Cinzel, serif; font-size: 22px; font-weight: 700; }
  .hidden { display: none !important; }
  #night { position: absolute; inset: 0; width: 1280px; height: 720px; background: #0E0C1C; color: #A9A2C6; overflow: hidden; }
  .star { position: absolute; border-radius: 999px; animation: tw 6s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: .25 } 50% { opacity: .85 } }
</style>
</head>
<body>
<div id="stage">

  <div id="day">
    <section class="col-l">
      <div>
        <div class="row" style="justify-content: space-between; align-items: baseline">
          <span id="date" class="cz" style="font-size: 16px; letter-spacing: .32em; color: #C9B37E"></span>
          <span id="battery" class="muted" style="font-size: 14px"></span>
        </div>
        <div id="clock" class="cz" style="font-size: 116px; line-height: 1; font-weight: 500"></div>
      </div>
      <div id="weather" style="display: grid; grid-template-columns: 1fr; gap: 12px"></div>
      <div id="drive"></div>
      <div id="binsTonight"></div>
      <div style="display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow: hidden">
        <div id="todayLabel" class="label">TODAY</div>
        <div id="today" style="display: flex; flex-direction: column; gap: 10px"></div>
      </div>
      <div id="binsNext"></div>
    </section>

    <section class="col-r">
      <div id="f1"></div>
      <div id="weekPanel" class="parch" style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 18px 28px 18px 40px; border-radius: 16px; min-height: 0">
        <div class="row" style="justify-content: space-between; align-items: baseline">
          <h2 class="cz" style="margin: 0; font-size: 24px; font-weight: 700">The Week Ahead</h2>
          <span id="weekRange" style="font-size: 16px; font-style: italic; color: #5C4A33"></span>
        </div>
        <div id="week" style="flex: 1; overflow: hidden"></div>
        <div class="row" style="gap: 20px; padding-top: 10px; border-top: 1px solid #D8C9A6; font-size: 16px">
          <span id="legend" class="row" style="gap: 20px"></span>
          <span id="notices" style="margin-left: auto; color: #5C4A33; text-align: right"></span>
        </div>
      </div>
      <div class="row" style="gap: 14px; align-items: stretch">
        <div id="bus" class="box" style="width: 236px; flex: none; padding: 16px 18px; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"></div>
        <div id="transport" class="box grow" style="display: none; padding: 12px 18px 12px; border-radius: 14px; flex-direction: column"></div>
        <div id="diesel" class="box grow" style="padding: 16px 18px; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"></div>
      </div>
    </section>
  </div>

  <div id="night" class="hidden">
    <div id="stars"></div>
    <div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span id="nDate" class="cz" style="font-size: 16px; letter-spacing: .34em; color: #8C86B0"></span>
      <span id="nClock" class="cz" style="font-size: 190px; line-height: 1; font-weight: 500; color: #8C86B0"></span>
      <span id="nMoon" class="row" style="gap: 10px; font-size: 18px; font-style: italic; color: #8C86B0"></span>
    </div>
    <div id="nInfo" style="position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); display: flex; gap: 36px; align-items: center; padding: 14px 28px; border: 1px solid #2E2A48; border-radius: 999px; font-size: 18px; white-space: nowrap"></div>
    <span id="nBattery" style="position: absolute; right: 28px; bottom: 24px; font-size: 14px; color: #8C86B0"></span>
  </div>
</div>

    '" stroke-width="' + (sw || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + ICONS[name] + '"></path></svg>';
}
function art(name, color, size, sw) {
  if (ART[name]) return '<img src="' + ART[name] + '" width="' + (size || 24) + '" height="' + (size || 24) +
    '" alt="" style="display: block; object-fit: contain" onerror="this.outerHTML=svgFallback(\'' + name + '\',\'' + color + '\',' + (size || 24) + ')">';
  return svg(name, color, size, sw);
}
function svgFallback(n, c, s) { return svg(n, c, s); }
/** Chance of rain for the rest of today: the highest hourly chance from now on, and when it peaks. */
function rainLine(w, now) {
  var h = w.hourly || {}, best = null, at = null, today = new Date(now).getDate();
  (h.time || []).forEach(function (t, i) {
    var ms = Date.parse(t), p = (h.rain || [])[i];
    if (p == null || ms < now - 3600000 || new Date(ms).getDate() !== today) return;
    if (best === null || p > best) { best = p; at = ms; }
  });
  if (best === null) best = w.rainToday;
  if (best == null) return '';
  var wet = best >= 30;
  return '<div style="margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">' +
    '<span class="cz" style="font-size: 11px; letter-spacing: .2em; color: #C9B37E">RAIN TODAY</span>' +
    '<span class="cz" style="font-size: 25px; line-height: 1.1; color: ' + (wet ? '#9EC3E6' : '#F3E9D2') + '">' + best + '%</span>' +
    '<span class="muted" style="font-size: 15px">' + (best < 15 ? 'Unlikely' : (at ? 'Most likely ' + hm(at) : 'Possible')) + '</span></div>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function $(id) { return document.getElementById(id); }

// ------------------------------------------------------------ time helpers (London)
function parts(ms) {
  var f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'long', day: 'numeric', month: 'long',
    year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: false });
  var o = {};
  f.formatToParts(new Date(ms)).forEach(function (p) { o[p.type] = p.value; });
  o.h = Number(o.hour) % 24; o.m = Number(o.minute);
  return o;
}
function dayKey(ms) { var p = parts(ms); return p.year + '-' + p.month + '-' + p.day; }
function isoKey(ms) { return new Date(ms).toLocaleDateString('en-CA', { timeZone: 'Europe/London' }); }
function hm(ms) { var p = parts(ms); return p.h + ':' + (p.m < 10 ? '0' : '') + p.m; }
function short(ms) {
  return new Date(ms).toLocaleString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '');
}
function minutesOfDay(ms) { var p = parts(ms); return p.h * 60 + p.m; }

// ------------------------------------------------------------ state
var DATA = null, BATTERY = '';

function weatherIcon(w) {
  var c = w.code;
  if (c >= 95) return 'storm';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if (c === 45 || c === 48) return 'fog';
  if (w.temp <= 0 && c <= 3) return 'frost';
  if (c <= 1) return w.isDay ? 'sun' : 'moon';
  return 'cloud';
}
function weatherWord(w) {
  var c = w.code;
  if (c >= 95) return 'Thunderstorms';
  if (c >= 71 && c <= 77 || c === 85 || c === 86) return 'Snow';
  if (c >= 80 && c <= 82) return 'Showers';
  if (c >= 61 && c <= 67) return 'Rain';
  if (c >= 51 && c <= 57) return 'Drizzle';
  if (c === 45 || c === 48) return 'Fog';
  if (w.temp <= 0) return 'Frost';
  if (c === 0) return 'Clear';
  if (c <= 2) return 'Partly cloudy';
  return 'Cloudy';
}
function person(key) { return (DATA && DATA.people && DATA.people[key]) || { name: key, color: '#7A5C12', tint: '#EFE4C6', icon: 'candle' }; }

// ------------------------------------------------------------ render
function parchBg() {
  if (!ART.parchment) return;
  var parch = document.querySelectorAll('.parch');
  for (var i = 0; i < parch.length; i++) parch[i].style.backgroundImage = 'url(' + ART.parchment + ')';
}
function render() {
  fit();
  var now = Date.now();
  var mins = minutesOfDay(now);
  var night = mins >= NIGHT_FROM || mins < NIGHT_TO;
  $('day').className = night ? 'hidden' : '';
  $('night').className = night ? '' : 'hidden';
  var p = parts(now);
  if (night) { renderNight(now, p); return; }

  $('date').textContent = (p.weekday + ' · ' + p.day + ' ' + p.month).toUpperCase();
  $('clock').textContent = hm(now);
  $('battery').textContent = BATTERY;
  if (!DATA) return;

  // Sections switched off in Config.gs
  var show = DATA.show || {};
  $('bus').style.display = show.bus === false ? 'none' : 'flex';
  $('diesel').style.display = show.fuel === false ? 'none' : 'flex';
  $('bus').style.flex = show.fuel === false ? '1' : '';
  $('transport').style.display = show.transport ? 'flex' : 'none';
  $('f1').style.display = show.f1 === false ? 'none' : '';

  // Weather
  $('weather').innerHTML = (DATA.weather || []).map(function (w) {
    return '<div class="box row" style="gap: 12px; padding: 10px 14px">' + svg(weatherIcon(w), '#F3E9D2', 38, 1.5) +
      '<div style="display: flex; flex-direction: column; min-width: 0">' +
      '<span class="cz" style="font-size: 12px; letter-spacing: .2em; color: #C9B37E">' + esc(w.place) + '</span>' +
      '<span class="cz" style="font-size: 25px; line-height: 1.1">' + w.temp + '°</span>' +
      '<span class="muted" style="font-size: 15px">' + weatherWord(w) + ' · ' + w.max + '° / ' + w.min + '°</span></div>' +
      rainLine(w, now) + '</div>';
  }).join('');
  $('weather').style.gridTemplateColumns = 'repeat(' + Math.max(1, (DATA.weather || []).length) + ', 1fr)';

  renderDrive(now);
  renderBins(now, mins);
  renderToday(now, mins);
  renderF1(now);
  renderWeek(now);
  renderBus(now);
  renderDiesel();
  if (show.transport) renderTransport(now);
  parchBg();
}

function renderDrive(now) {

  var sub = alert ? (d.change.reason + ' · via ' + d.change.via) :
    ('via ' + roads + (d.delayMin > 1 ? ' · ' + d.delayMin + ' min slower than usual' : ' · normal traffic'));
  var note = [];
  if (d.frost != null) note.push('Frost ' + d.frost + '°: scrape the car (+5 min)');
  if (d.sentAt) note.push('new route sent to ' + person('commuter').name + '’s phone ' + d.sentAt);
  el.innerHTML =
    '<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-radius: 12px; ' +
      (alert ? 'border: 2px solid #D9574C; background: #2A1B2A' : 'border: 1px solid #4A4466') + '">' +
    '<div class="row" style="gap: 14px">' +
      '<span class="badge" style="background: #F3DDE7">' + svg('cat', '#B03A6F', 24) + '</span>' +
      '<div class="grow" style="display: flex; flex-direction: column">' +
        '<span style="font-size: 19px; font-weight: 500">' + esc(d.title) + (alert ? ' · new route' : '') + '</span>' +
        '<span style="font-size: 15px; color: ' + (alert ? '#F2B3AC' : '#A9A2C6') + '">' + esc(sub) + '</span></div>' +
      '<div style="display: flex; flex-direction: column; align-items: flex-end; flex: none">' +
        '<span class="cz" style="font-size: 28px; line-height: 1">' + d.liveMin + ' min</span>' +
        (d.leaveBy ? '<span style="font-size: 15px; color: ' + (alert ? '#F2B3AC' : '#E0A84A') + '">Leave by ' + esc(d.leaveBy) + '</span>' : '') +
      '</div></div>' +
    (note.length ? '<div class="row" style="gap: 8px; padding-top: 8px; border-top: 1px solid #4A4466; font-size: 15px; color: #DCD6F0">' +
      svg('frost', '#9FC7E8', 16) + '<span>' + esc(note.join(' · ')) + '</span></div>' : '') +
    '</div>';
}

function renderBinsNext(now, mins) {
  var b = DATA.bins, el = $('binsNext');
  if (!b) { el.innerHTML = ''; return; }
  var pick = null, when = '';

  if (!when && pick.date) {
    var p = String(pick.date).split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    when = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }).toUpperCase();
  }
  var label = String(pick.label || ''), cut = label.indexOf(' & ');
  var main = cut === -1 ? label : label.slice(0, cut), extra = cut === -1 ? '' : label.slice(cut + 3);

  el.innerHTML = '<div class="box row" style="gap: 14px; padding: 12px 16px">' +
    '<span class="badge" style="background: #EFE4C6">' + svg('bin', col, 24) + '</span>' +
    '<div class="grow" style="display: flex; flex-direction: column">' +

function renderToday(now, mins) {
  var evening = mins >= 17 * 60;

  var today = dayKey(now), rows = [];

      .slice(0, 4).map(function (e) {

function renderBus(now) {
  var b = DATA.bus, head = '<div class="row" style="gap: 8px">' + svg('bus', '#C9B37E', 20, 1.6) +

function renderTransport(now) {
  var t = DATA.transport, el = $('transport');
  var head = function (icon, text) { return '<div class="row" style="gap: 7px; margin-bottom: 4px">' + svg(icon, '#C9B37E', 18, 1.6) +
    '<span class="cz" style="font-size: 11px; letter-spacing: .18em; color: #C9B37E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">' + esc(text) + '</span></div>'; };
  var line = function (left, mid, right, rightColor) {
    return '<div class="row" style="gap: 8px; align-items: baseline; font-size: 17px; line-height: 1.35">' + left +
      '<span class="grow" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">' + mid + '</span>' +
      '<span style="flex: none; color: ' + (rightColor || '#F3E9D2') + '">' + right + '</span></div>'; };
  var mins = function (ms) { var w = Math.round((ms - now) / 60000); return w <= 0 ? 'due' : w + ' min'; };
  if (!t) { el.innerHTML = '<span class="muted">Live travel unavailable</span>'; return; }
  var cols = [];

    esc(t.line.name + ' line: ' + t.line.status) + '</div>';
  cols.push(r);
  // Buses
  (t.buses || []).forEach(function (b) {
    var list = (b.departures || []).filter(function (d) { return d.time > now - 30000; }).slice(0, 3);
    var c = head('bus', b.name.toUpperCase());
    if (!list.length) c += '<span class="muted" style="font-size: 16px">No buses listed</span>';
    list.forEach(function (d) {
      c += line('<span class="cz" style="flex: none; min-width: 34px; font-size: 15px; font-weight: 700; color: #1C1A2E; background: #C9B37E; border-radius: 5px; padding: 0 5px; text-align: center">' + esc(d.line) + '</span>',
        '<span class="muted" style="font-size: 14px">' + esc(d.destination) + '</span>', mins(d.time), '#F3E9D2');

  if (t.line && !t.line.good && t.line.reason) html += '<div class="row" style="gap: 8px; margin-top: 8px; padding-top: 7px; border-top: 1px solid #4A4466; font-size: 15px; color: #E0A84A">' +
    svg('alert', '#E0A84A', 16) + '<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">' + esc(t.line.reason) + '</span></div>';
  el.innerHTML = html;

    return '<div class="row" style="gap: 12px; align-items: baseline; font-size: 17px">' +
      '<span class="cz" style="font-size: 13px; color: #C9B37E; width: 14px">' + (i + 1) + '</span>' +
      '<span class="grow" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">' + esc(s.name) + (s.area ? ' · ' + esc(s.area) : '') + '</span>' +
      '<span class="muted" style="font-size: 14px">' + s.miles + ' mi</span>' +
      '<span class="cz" style="font-size: 20px; width: 78px; text-align: right">' + s.price.toFixed(1) + 'p</span></div>';
  }).join('');
  $('diesel').innerHTML = head + body;
}

// ------------------------------------------------------------ night mode
var starsMade = false;
function makeStars() {
  if (starsMade) return; starsMade = true;
  var seed = 7, html = '';
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var i = 0; i < 90; i++) {
    var x = Math.round(rnd() * 1270), y = Math.round(rnd() * 790);
    if (y > 160 && y < 520 && x > 280 && x < 1000) continue;
    var size = rnd() > .85 ? 3 : (rnd() > .5 ? 2 : 1), warm = rnd() > .88;
    html += '<span class="star" style="left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size +
      'px;background:' + (warm ? '#C9A44C' : '#DCD6F0') + ';animation-delay:' + (rnd() * 6).toFixed(1) + 's"></span>';
  }
  $('stars').innerHTML = html;
}
function moonPhase(ms) {
  var lunation = 29.530588853, known = Date.UTC(2000, 0, 6, 18, 14);
  var age = (((ms - known) / 864e5) % lunation + lunation) % lunation;
  var names = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  return names[Math.floor((age / lunation) * 8 + .5) % 8];
}
function renderNight(now, p) {
  makeStars();
  $('nDate').textContent = (p.weekday + ' · ' + p.day + ' ' + p.month).toUpperCase();
  $('nClock').textContent = hm(now);
  $('nMoon').innerHTML = svg('moon', '#8C86B0', 20, 1.6) + '<span>' + moonPhase(now) + '</span>';
  $('nBattery').textContent = BATTERY ? BATTERY + ' · wakes at ' + WAKE_AT : 'Wakes at ' + WAKE_AT;
  var info = [];
  if (DATA && DATA.bins && (DATA.bins.tonight || (minutesOfDay(now) < NIGHT_TO && DATA.bins.today))) {
    var b = DATA.bins.tonight || DATA.bins.today;
    info.push(svg('bin', '#A9A2C6', 18) + '<span>Bins out tonight: ' + esc(b.label.toLowerCase()) + '</span>');
  }
  if (DATA && DATA.weather && DATA.weather[0]) {
    var low = nextMorningLow(DATA.weather[0], now);
    if (low != null && low <= 3) info.push(svg('frost', '#A9A2C6', 18) + '<span>Frost likely by morning (' + Math.round(low) + '°)</span>');
  }
  if (DATA && DATA.calendar) {
    var tomorrow = dayKey(now + (minutesOfDay(now) >= NIGHT_FROM ? 864e5 : 0));
    var first = (DATA.calendar.events || []).filter(function (e) { return dayKey(e.start) === tomorrow && !e.allDay; })[0];
    if (first) info.push('<span>Tomorrow: ' + esc(first.title) + ' ' + hm(first.start) + '</span>');
  }
  $('nInfo').innerHTML = info.map(function (h) { return '<span class="row" style="gap: 8px">' + h + '</span>'; }).join('');
  $('nInfo').style.display = info.length ? 'flex' : 'none';
}
function nextMorningLow(w, now) {
  var target = dayKey(now + (minutesOfDay(now) >= NIGHT_FROM ? 864e5 : 0));
  var low = null, h = w.hourly || { time: [], temp: [] };
  for (var i = 0; i < h.time.length; i++) {
    if (h.time[i].indexOf(target) === 0) {
      var hr = Number(h.time[i].substr(11, 2));
      if (hr >= 6 && hr <= 8 && (low === null || h.temp[i] < low)) low = h.temp[i];
    }
  }
  return low;
}

// ------------------------------------------------------------ data + loop
function load() {
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function (d) { DATA = d; render(); })
      .withFailureHandler(function () { /* keep showing the last data; try again next round */ })
      .getBoardData(BOARD_KEY);
  } else if (API_URL) {
    fetch(API_URL + '?api=1&k=' + encodeURIComponent(BOARD_KEY))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && !d.error) { DATA = d; render(); } })
      .catch(function () { /* keep the last data; try again next round */ });
  } else if (window.SAMPLE_DATA) {
    DATA = window.SAMPLE_DATA; render();
  }
}
var STAGE_W = 1280, STAGE_H = 720;   // TV shape (16:9)
function fit() {
  // Use the smallest size any measure reports: some TV browsers over-report the window size.
  var de = document.documentElement, vv = window.visualViewport;
  var ws = [window.innerWidth, de.clientWidth, vv && vv.width].filter(function (x) { return x > 0; });
  var hs = [window.innerHeight, de.clientHeight, vv && vv.height].filter(function (x) { return x > 0; });
  var w = Math.min.apply(null, ws), h = Math.min.apply(null, hs);
  var s = Math.min(w / STAGE_W, h / STAGE_H);
  $('stage').style.transform = 'scale(' + s + ')';
  $('stage').style.left = Math.round((w - STAGE_W * s) / 2) + 'px';
  $('stage').style.top = Math.round((h - STAGE_H * s) / 2) + 'px';
}
function battery() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then(function (b) {
    function upd() { BATTERY = 'Battery ' + Math.round(b.level * 100) + '%' + (b.charging ? ' · charging' : ' · resting'); }
    upd(); b.addEventListener('levelchange', upd); b.addEventListener('chargingchange', upd);
  }, function () {});
}
function applyArt() {
  if (ART.dayBg) $('day').style.background = 'linear-gradient(rgba(28,26,46,.55), rgba(28,26,46,.55)), url(' + ART.dayBg + ') center / cover';
  if (ART.nightSky) $('night').style.background = '#0E0C1C url(' + ART.nightSky + ') center / cover';
  var parch = document.querySelectorAll('.parch');
  for (var i = 0; i < parch.length; i++) if (ART.parchment) parch[i].style.background = '#F1E6CC url(' + ART.parchment + ') center / cover';
  if (ART.corner) {
    var wk = $('weekPanel');
    wk.insertAdjacentHTML('beforeend', '<img src="' + ART.corner + '" alt="" style="position: absolute; left: 6px; top: 6px; width: 64px; opacity: .85; pointer-events: none">' +
      '<img src="' + ART.corner + '" alt="" style="position: absolute; right: 6px; bottom: 6px; width: 64px; opacity: .85; transform: rotate(180deg); pointer-events: none">');
  }
}
window.addEventListener('resize', fit);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
window.addEventListener('load', fit);
fit(); render(); applyArt(); load();
setInterval(render, 15000);
setInterval(load, REFRESH_MS);
// Reload the whole page once a night to clear memory on the old tablet.
setInterval(function () { var m = minutesOfDay(Date.now()); if (m === 4 * 60) location.reload(); }, 60000);

// First run: ask for the board link.
function showSetup() {
  document.body.innerHTML = '<div style="max-width: 640px; margin: 80px auto; padding: 0 24px; font-family: Georgia, serif; color: #F3E9D2">' +
    '<h1 style="font-weight: 500">Family board setup</h1>' +
    '<p>Paste your board link (it ends in <b>/exec?k=</b> and your key), then tap Save.</p>' +
    '<input id="lnk" style="width: 100%; box-sizing: border-box; font-size: 18px; padding: 12px; border-radius: 8px; border: 1px solid #4A4466">' +
    '<p><button id="sv" style="font-size: 20px; padding: 12px 28px; border-radius: 8px; border: 0; background: #C9B37E; color: #1C1A2E">Save</button></p>' +
    '<p id="msg" style="color: #E8907F"></p></div>';
  document.getElementById('sv').onclick = function () {
    var v = document.getElementById('lnk').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\/?#]+\/exec\?k=/.test(v)) {
      document.getElementById('msg').textContent = 'That doesn\'t look like the board link. It should start https://script.google.com/macros/s/ and contain /exec?k=';
      return;
    }
    try { localStorage.setItem('boardLink', v); } catch (e) {}
    location.reload();
  };
}
if (!CFG) showSetup();
</script>
